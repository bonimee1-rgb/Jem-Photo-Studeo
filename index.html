<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jem Photo Studio - Advanced Editor</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons for UI -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <h2>Jem Photo Studio - ዘመናዊ ፎቶ ስቱዲዮ</h2>
        
        <div class="editor-wrapper">
            <!-- ፎቶ የሚታይበት ቦታ -->
            <div class="preview-box" id="drop-area">
                <img id="preview-img" src="" alt="ፎቶ ይምረጡ ወይም ይጎትቱ (Drag & Drop)" style="display: none;">
                <div id="placeholder-text">
                    <i class="fa-solid fa-cloud-arrow-up fa-2x"></i>
                    <p>ፎቶ እዚህ ይጫኑ ወይም ይጎትቱ</p>
                </div>
            </div>

            <!-- ማስተካከያ አማራጮች (Controls) -->
            <div class="controls">
                
                <!-- ኖብ / ታብ ምርጫዎች -->
                <div class="tabs">
                    <button class="tab-btn active" data-target="adjust-panel">ማስተካከያ</button>
                    <button class="tab-btn" data-target="bg-panel">ጀርባ (BG)</button>
                    <button class="tab-btn" data-target="text-panel">ጽሁፍ & ስዕል</button>
                </div>

                <!-- 1. ማስተካከያ ፓነል -->
                <div class="panel active" id="adjust-panel">
                    <p class="title">ቀለሞች እና ማጣሪያዎች</p>
                    <div class="filter-btns">
                        <button id="brightness" class="active">ብሩህነት</button>
                        <button id="saturation"> ከለር</button>
                        <button id="contrast"> ኮንትራስት</button>
                        <button id="grayscale"> ጥቁርና ነጭ</button>
                    </div>

                    <div class="slider">
                        <div class="filter-info">
                            <text class="name">ብሩህነት</text>
                            <text class="value">100%</text>
                        </div>
                        <input type="range" value="100" min="0" max="200" id="filter-slider">
                    </div>

                    <div class="rotate-panel" style="margin-top: 15px;">
                        <p class="title">ማዞሪያ እና ማንጸባረቂያ</p>
                        <div class="icons">
                            <button id="rotate-left" title="ግራ አዙር"><i class="fa-solid fa-rotate-left"></i></button>
                            <button id="rotate-right" title="ቀኝ አዙር"><i class="fa-solid fa-rotate-right"></i></button>
                            <button id="flip-x" title="አግድም ገልብጥ"><i class="fa-solid fa-arrows-alt-h"></i></button>
                            <button id="flip-y" title="ቁም ገልብጥ"><i class="fa-solid fa-arrows-alt-v"></i></button>
                        </div>
                    </div>
                </div>

                <!-- 2. የጀርባ (Background) ማስተካከያ ፓነል -->
                <div class="panel" id="bg-panel">
                    <p class="title">የጀርባ (Background) ቀለሞች እና ህብረ ቀለም</p>
                    <div class="bg-options">
                        <button class="bg-btn" style="background: #ffffff;" data-bg="#ffffff"></button>
                        <button class="bg-btn" style="background: #1e1e2f;" data-bg="#1e1e2f"></button>
                        <button class="bg-btn" style="background: #ff4757;" data-bg="#ff4757"></button>
                        <button class="bg-btn" style="background: #2ed573;" data-bg="#2ed573"></button>
                        <button class="bg-btn" style="background: #1e90ff;" data-bg="#1e90ff"></button>
                        <button class="bg-btn" style="background: linear-gradient(45deg, #ff9a9e, #fad0c4);" data-bg="gradient-1"></button>
                    </div>
                    <div style="margin-top: 15px;">
                        <label for="custom-bg-color">ብጁ የጀርባ ቀለም ፈልግ:</label>
                        <input type="color" id="custom-bg-color" value="#ffffff" style="width: 100%; height: 35px; border: none; cursor: pointer; margin-top: 5px;">
                    </div>
                </div>

                <!-- 3. ጽሁፍ ማቀናበሪያ ፓነል -->
                <div class="panel" id="text-panel">
                    <p class="title">በፎቶው ላይ ጽሁፍ ማከል</p>
                    <input type="text" id="watermark-text" placeholder="የሚፈልጉትን ጽሁፍ ይጻፉ..." style="width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px;">
                    <div style="display: flex; gap: 10px;">
                        <div style="flex: 1;">
                            <label>የጽሁፍ ቀለም:</label>
                            <input type="color" id="text-color" value="#ffffff" style="width: 100%; height: 30px; border: none; cursor: pointer;">
                        </div>
                        <div style="flex: 1;">
                            <label>መጠኑ (Size):</label>
                            <input type="range" id="text-size" min="12" max="60" value="24" style="width: 100%;">
                        </div>
                    </div>
                    <button id="apply-text-btn" style="width: 100%; margin-top: 15px; padding: 8px; background: #4a90e2; color: #fff; border: none; border-radius: 4px; cursor: pointer;">ጽሁፉን ፎቶው ላይ ጫን</button>
                </div>

            </div>
        </div>

        <!-- ፋይል መጫኛ እና ማውረጃ ቁልፎች -->
        <div class="controls-row">
            <input type="file" id="file-input" accept="image/*" hidden>
            <button class="choose-img"><i class="fa-solid fa-folder-open"></i> ፎቶ ምረጥ</button>
            <button class="reset-filter"><i class="fa-solid fa-rotate"></i> ሪሴት አድርግ</button>
            <button class="save-img"><i class="fa-solid fa-download"></i> ፎቶ አውርድ</button>
        </div>
    </div>

    <canvas id="output-canvas" style="display:none;"></canvas>
    <script src="script.js"></script>
</body>
</html>
