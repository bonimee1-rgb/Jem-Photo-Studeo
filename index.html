<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jem Photo Studio - ዘመናዊ ፎቶ ስቱዲዮ</title>
    <!-- Tailwind CSS for Modern App UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- App Container -->
    <div class="w-full sm:max-w-md bg-slate-900 sm:rounded-3xl shadow-2xl flex flex-col h-screen sm:h-[850px] overflow-hidden border border-slate-800">
        
        <!-- Top Header -->
        <header class="px-5 py-4 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 flex items-center justify-between z-10">
            <div class="flex items-center space-x-2 space-x-reverse">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-camera-retro text-white text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base text-white tracking-wide">Jem Photo Studio</h1>
                    <p class="text-[10px] text-slate-400">ዘመናዊ የፎቶ ማስተካከያ</p>
                </div>
            </div>
            <button id="reset-btn" class="text-xs text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg transition flex items-center space-x-1 space-x-reverse">
                <i class="fa-solid fa-rotate-right"></i>
                <span>ሪሴት</span>
            </button>
        </header>

        <!-- Main Workspace (Image Preview Area) -->
        <div id="workspace" class="flex-1 relative bg-slate-950 flex items-center justify-center overflow-hidden p-4 select-none">
            
            <!-- Upload Placeholder (Shown when no image) -->
            <div id="upload-placeholder" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center cursor-pointer hover:bg-slate-900/40 transition">
                <div class="w-16 h-16 rounded-2xl bg-blue-600/10 border border-blue-500/20 flex items-center justify-center text-blue-500 mb-4 shadow-inner">
                    <i class="fa-solid fa-cloud-arrow-up text-2xl"></i>
                </div>
                <h3 class="font-semibold text-slate-200 text-base mb-1">ፎቶ እዚህ ይጫኑ</h3>
                <p class="text-xs text-slate-400 max-w-[200px] mb-4">ፎቶ ለመምረጥ ወይም ለመጫንይንኩ</p>
                <span class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition">
                    ፎቶ ምረጥ (Browse)
                </span>
            </div>

            <!-- Image Preview Canvas/Container -->
            <div id="image-container" class="relative max-w-full max-h-full flex items-center justify-center transition-all duration-200 shadow-2xl rounded-lg overflow-hidden" style="display: none; background: #ffffff;">
                <img id="preview-img" src="" alt="Edited Photo" class="max-w-full max-h-[380px] object-contain">
            </div>

            <!-- Hidden File Input -->
            <input type="file" id="file-input" accept="image/*" class="hidden">
        </div>

        <!-- Editor Tools & Tabs Section -->
        <div class="bg-slate-900 border-t border-slate-800 flex flex-col">
            
            <!-- Tabs Header -->
            <div class="grid grid-cols-3 gap-1 p-2 bg-slate-950/50">
                <button class="tab-btn active py-2 px-3 text-xs font-semibold rounded-lg transition text-slate-400 hover:text-white flex items-center justify-center space-x-1 space-x-reverse bg-slate-800 text-white shadow" data-target="adjust-tab">
                    <i class="fa-solid fa-sliders"></i>
                    <span>ማስተካከያ</span>
                </button>
                <button class="tab-btn py-2 px-3 text-xs font-semibold rounded-lg transition text-slate-400 hover:text-white flex items-center justify-center space-x-1 space-x-reverse" data-target="bg-tab">
                    <i class="fa-solid fa-image"></i>
                    <span>ጀርባ (BG)</span>
                </button>
                <button class="tab-btn py-2 px-3 text-xs font-semibold rounded-lg transition text-slate-400 hover:text-white flex items-center justify-center space-x-1 space-x-reverse" data-target="text-tab">
                    <i class="fa-solid fa-font"></i>
                    <span>ጽሁፍ</span>
                </button>
            </div>

            <!-- Tab Contents Container -->
            <div class="p-4 h-48 overflow-y-auto custom-scrollbar">
                
                <!-- 1. Adjust Tab -->
                <div id="adjust-tab" class="tab-content space-y-4">
                    <!-- Filter Buttons Grid -->
                    <div class="grid grid-cols-4 gap-2">
                        <button class="filter-option active flex flex-col items-center justify-center p-2 rounded-xl bg-slate-800 border border-slate-700 text-xs font-medium text-blue-400 transition" data-filter="brightness">
                            <i class="fa-solid fa-sun mb-1"></i> ብሩህነት
                        </button>
                        <button class="filter-option flex flex-col items-center justify-center p-2 rounded-xl bg-slate-800 border border-slate-700 text-xs font-medium text-slate-300 transition" data-filter="saturation">
                            <i class="fa-solid fa-droplet mb-1"></i> ከለር
                        </button>
                        <button class="filter-option flex flex-col items-center justify-center p-2 rounded-xl bg-slate-800 border border-slate-700 text-xs font-medium text-slate-300 transition" data-filter="contrast">
                            <i class="fa-solid fa-circle-half-stroke mb-1"></i> ኮንትራስት
                        </button>
                        <button class="filter-option flex flex-col items-center justify-center p-2 rounded-xl bg-slate-800 border border-slate-700 text-xs font-medium text-slate-300 transition" data-filter="grayscale">
                            <i class="fa-solid fa-wand-magic-sparkles mb-1"></i> ግራጫ
                        </button>
                    </div>

                    <!-- Slider Control -->
                    <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-800 space-y-2">
                        <div class="flex justify-between text-xs">
                            <span id="slider-label" class="text-slate-300 font-medium">ብሩህነት</span>
                            <span id="slider-value" class="text-blue-400 font-bold">100%</span>
                        </div>
                        <input type="range" id="main-slider" min="0" max="200" value="100" class="w-full accent-blue-600 bg-slate-700 rounded-lg h-1.5 cursor-pointer">
                    </div>

                    <!-- Rotate & Flip Controls -->
                    <div class="flex items-center justify-between bg-slate-800/50 p-2 rounded-xl border border-slate-800">
                        <span class="text-xs text-slate-400 px-2 font-medium">ማዞሪያ:</span>
                        <div class="flex space-x-1 space-x-reverse">
                            <button id="rotate-left" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition" title="ግራ አዙር"><i class="fa-solid fa-rotate-left text-xs"></i></button>
                            <button id="rotate-right" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition" title="ቀኝ አዙር"><i class="fa-solid fa-rotate-right text-xs"></i></button>
                            <button id="flip-x" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition" title="አግድም ገልብጥ"><i class="fa-solid fa-arrows-left-right text-xs"></i></button>
                            <button id="flip-y" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition" title="ቁም ገልብጥ"><i class="fa-solid fa-arrows-up-down text-xs"></i></button>
                        </div>
                    </div>
                </div>

                <!-- 2. Background Tab -->
                <div id="bg-tab" class="tab-content space-y-3 hidden">
                    <p class="text-xs text-slate-400">የፎቶውን ጀርባ ቀለም ይምረጡ:</p>
                    <div class="flex flex-wrap gap-3">
                        <button class="bg-choice w-9 h-9 rounded-full border-2 border-slate-700 shadow-md transition transform hover:scale-110 focus:outline-none" style="background: #ffffff;" data-bg="#ffffff"></button>
                        <button class="bg-choice w-9 h-9 rounded-full border-2 border-slate-700 shadow-md transition transform hover:scale-110 focus:outline-none" style="background: #0f172a;" data-bg="#0f172a"></button>
                        <button class="bg-choice w-9 h-9 rounded-full border-2 border-slate-700 shadow-md transition transform hover:scale-110 focus:outline-none" style="background: #ef4444;" data-bg="#ef4444"></button>
                        <button class="bg-choice w-9 h-9 rounded-full border-2 border-slate-700 shadow-md transition transform hover:scale-110 focus:outline-none" style="background: #22c55e;" data-bg="#22c55e"></button>
                        <button class="bg-choice w-9 h-9 rounded-full border-2 border-slate-700 shadow-md transition transform hover:scale-110 focus:outline-none" style="background: #3b82f6;" data-bg="#3b82f6"></button>
                        <button class="bg-choice w-9 h-9 rounded-full border-2 border-slate-700 shadow-md transition transform hover:scale-110 focus:outline-none" style="background: linear-gradient(135deg, #f43f5e, #fb923c);" data-bg="gradient-1"></button>
                    </div>
                    <div class="pt-2">
                        <label class="text-xs text-slate-400 block mb-1">ብጁ ቀለም (Custom Color):</label>
                        <input type="color" id="custom-color-picker" value="#ffffff" class="w-full h-9 rounded-xl bg-slate-800 border border-slate-700 cursor-pointer">
                    </div>
                </div>

                <!-- 3. Text Tab -->
                <div id="text-tab" class="tab-content space-y-3 hidden">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">የሚጻፍ ጽሁፍ (Watermark):</label>
                        <input type="text" id="watermark-input" placeholder="ስም ወይም ጽሁፍ ይጻፉ..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="flex gap-3">
                        <div class="flex-1">
                            <label class="text-xs text-slate-400 block mb-1">የጽሁፍ ቀለም:</label>
                            <input type="color" id="text-color-picker" value="#ffffff" class="w-full h-8 rounded-lg bg-slate-800 border border-slate-700 cursor-pointer">
                        </div>
                        <div class="flex-1">
                            <label class="text-xs text-slate-400 block mb-1">የፊደል መጠን:</label>
                            <input type="range" id="text-size-slider" min="16" max="64" value="28" class="w-full accent-blue-600 bg-slate-700 rounded-lg h-1.5 mt-2 cursor-pointer">
                        </div>
                    </div>
                </div>

            </div>

            <!-- Bottom Action Footer (Download Button) -->
            <div class="p-3 bg-slate-950 border-t border-slate-800 flex gap-2">
                <button id="change-img-btn" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 py-3 rounded-xl font-semibold text-xs transition flex items-center justify-center space-x-1 space-x-reverse">
                    <i class="fa-solid fa-folder-open"></i>
                    <span>ፎቶ ቀይር</span>
                </button>
                <button id="download-btn" class="flex-[2] bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white py-3 rounded-xl font-bold text-xs shadow-lg shadow-blue-600/30 transition flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-download"></i>
                    <span>ፎቶ አውርድ (Download)</span>
                </button>
            </div>

        </div>
    </div>

    <!-- Hidden Canvas for Processing -->
    <canvas id="canvas" class="hidden"></canvas>

    <!-- App Logic Script -->
    <script>
        const fileInput = document.getElementById('file-input');
        const uploadPlaceholder = document.getElementById('upload-placeholder');
        const imageContainer = document.getElementById('image-container');
        const previewImg = document.getElementById('preview-img');
        const workspace = document.getElementById('workspace');
        
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        
        const filterOptions = document.querySelectorAll('.filter-option');
        const mainSlider = document.getElementById('main-slider');
        const sliderLabel = document.getElementById('slider-label');
        const sliderValue = document.getElementById('slider-value');
        
        const rotateLeftBtn = document.getElementById('rotate-left');
        const rotateRightBtn = document.getElementById('rotate-right');
        const flipXBtn = document.getElementById('flip-x');
        const flipYBtn = document.getElementById('flip-y');
        
        const bgChoices = document.querySelectorAll('.bg-choice');
        const customColorPicker = document.getElementById('custom-color-picker');
        
        const watermarkInput = document.getElementById('watermark-input');
        const textColorPicker = document.getElementById('text-color-picker');
        const textSizeSlider = document.getElementById('text-size-slider');
        
        const resetBtn = document.getElementById('reset-btn');
        const changeImgBtn = document.getElementById('change-img-btn');
        const downloadBtn = document.getElementById('download-btn');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // State variables
        let currentFilter = 'brightness';
        let filters = { brightness: 100, saturation: 100, contrast: 100, grayscale: 0 };
        let rotate = 0, scaleX = 1, scaleY = 1;
        let currentBg = '#ffffff';
        let hasImage = false;

        // Trigger file select
        uploadPlaceholder.addEventListener('click', () => fileInput.click());
        changeImgBtn.addEventListener('click', () => fileInput.click());

        // File selection handler
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                previewImg.src = event.target.result;
                previewImg.onload = () => {
                    uploadPlaceholder.style.display = 'none';
                    imageContainer.style.display = 'flex';
                    hasImage = true;
                    resetAll();
                };
            };
            reader.readAsDataURL(file);
        });

        // Tabs switching
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => {
                    b.classList.remove('bg-slate-800', 'text-white', 'shadow');
                    b.classList.add('text-slate-400');
                });
                btn.classList.add('bg-slate-800', 'text-white', 'shadow');
                btn.classList.remove('text-slate-400');

                const target = btn.getAttribute('data-target');
                tabContents.forEach(content => {
                    content.classList.add('hidden');
                    if (content.id === target) content.classList.remove('hidden');
                });
            });
        });

        // Filter selection
        filterOptions.forEach(btn => {
            btn.addEventListener('click', () => {
                filterOptions.forEach(b => {
                    b.classList.remove('bg-slate-700', 'border-blue-500', 'text-blue-400');
                    b.classList.add('bg-slate-800', 'text-slate-300');
                });
                btn.classList.add('bg-slate-700', 'border-blue-500', 'text-blue-400');
                btn.classList.remove('bg-slate-800', 'text-slate-300');

                currentFilter = btn.getAttribute('data-filter');
                sliderLabel.textContent = btn.textContent.trim();
                mainSlider.value = filters[currentFilter];
                sliderValue.textContent = filters[currentFilter] + '%';
                
                if (currentFilter
